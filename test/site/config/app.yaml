# The acceptance site of @nera-static/theme-blog (ROADMAP-themes §S7, §S15):
# the sample content of design/blog-themes/blog/ ("Marginalia") in English
# and German, extended by a series, facts, an author and a highlight tag; the
# theme used by local path.
lang: en
name: Marginalia
origin: https://example.org
robots: index,follow
theme: ../..

translations:
    en:
        language_name: English
    de:
        language_name: Deutsch
        # theme keys (§S2.6, §S4.3, §S11.6)
        Skip to content: Zum Inhalt springen
        Main navigation: Hauptnavigation
        Language: Sprache
        Legal: Rechtliches
        Recent posts: Neueste Beiträge
        All posts: Alle Beiträge
        Published: Veröffentlicht
        Updated: Aktualisiert
        By: Von
        Latest post: Neuester Beitrag
        Series: Serie
        Part: Teil
        About the author: Über die Autorin
        Read more: Weiterlesen
        posts: Beiträge
        # footer_links labels (config/theme.yaml)
        Imprint: Impressum
        Privacy: Datenschutz
        # plugin keys: plugin-page-pagination
        Pagination: Blätternavigation
        # plugin keys: plugin-search
        search_label: Suche
        search_placeholder: Suchen …
        search_no_results: Keine Treffer
